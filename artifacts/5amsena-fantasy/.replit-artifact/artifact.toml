kind = "web"
previewPath = "/"
title = "5amsena Fantasy"
description = "A live Premier League and Fantasy Premier League analytics dashboard that predicts fixtures, estimates player points, and builds a constrained Best XI."
version = "1.0.0"
id = "artifacts/5amsena-fantasy"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24280

[services.development]
run = "pnpm --filter @workspace/5amsena-fantasy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/5amsena-fantasy", "run", "build" ]
serve = "static"
publicDir = "artifacts/5amsena-fantasy/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24280"
BASE_PATH = "/"
